<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Warden Cannon Calculator</title>
<link rel="icon" href="https://minecraftfaces.com/wp-content/bigfaces/big-warden-face.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg: #121212;
    --panel: #1f1f1f;
    --panel-2: #171717;
    --line: #333333;
    --ink: #ffffff;
    --ink-dim: #aaaaaa;
    --ink-faint: #979797;
    --blue: #3b82f6;
    --blue-bright: #60a5fa;
    --green: #22c55e;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  .wrap{ max-width: 880px; margin: 0 auto; padding: 0 20px 60px; }
  .header-container{ background: var(--panel); padding: 28px 20px; margin-bottom: 28px; }
  .header-inner{ max-width: 880px; margin: 0 auto; padding: 0 20px; }
  h1{ font-size: 28px; font-weight: 800; margin: 0 0 4px; }
  .subtitle{ color: var(--ink-dim); font-size: 14px; margin: 0; }
  .sub-desc{ color: var(--ink-faint); font-size: 13px; margin: 10px 0 0; max-width: 560px; line-height: 1.5; }

  .grid2{ display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 640px){ .grid2{ grid-template-columns: 1fr; } }

  .card{ background: var(--panel); border-radius: 0.75rem; padding: 18px 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); transition: box-shadow 0.2s; }
  .card:hover{ box-shadow: 0 6px 14px rgba(0,0,0,0.3); }
  .panel-label{ font-size: 12px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--blue-bright); margin: 0 0 14px; }

  .coord-row{ display:flex; gap: 10px; }
  .field{ flex:1; }
  label{ display:block; font-size: 12px; color: var(--ink-faint); margin-bottom: 6px; }
  input, select{
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 0.5rem;
    outline: none;
  }
  input:focus, select:focus{ border-color: var(--blue); }
  select option{ background: var(--panel-2); }

  button.solve{
    margin-top: 18px; width: 100%; background: var(--blue); color: #fff;
    border: none; font-weight: 600; font-size: 14px; letter-spacing: 0.3px;
    padding: 13px; border-radius: 0.5rem; cursor: pointer; transition: background 0.15s ease;
  }
  button.solve:hover{ background: var(--blue-bright); }

  .results{ margin-top: 20px; display: flex; flex-direction: column; gap: 20px; }
  .hidden{ display:none; }

  .load-times{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 2px; }
  .load-card{
    background: var(--panel-2); border: 1px solid var(--line);
    border-left: 3px solid var(--blue); border-radius: 0.5rem; padding: 14px 16px;
  }
  .load-card .axis{ font-size: 12px; color: var(--blue-bright); letter-spacing: 0.5px; text-transform: uppercase; font-weight: 600; }
  .load-card .time{ font-size: 28px; font-weight: 800; margin-top: 4px; }
  .load-card .time span{ font-size: 14px; color: var(--ink-faint); font-weight: 400; }
  .load-card .stacks{ color: var(--ink-faint); font-size: 13px; margin-top: 2px; }

  .landing-details{ margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-dim); line-height: 1.8; }
  .landing-details b{ color: var(--ink); }

  .rotation-group{ display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .rot-btn{
    flex: 1; min-width: 60px;
    background: var(--panel-2); border: 1px solid var(--line);
    color: var(--ink-dim); font-size: 13px; font-weight: 600;
    padding: 9px 8px; border-radius: 0.5rem; cursor: pointer;
    transition: all 0.12s ease; text-align: center; user-select: none;
  }
  .rot-btn:hover{ border-color: var(--blue); color: var(--ink); }
  .rot-btn.active{ background: var(--blue); border-color: var(--blue); color: #fff; }
</style>
</head>
<body>

<div class="header-container">
  <div class="header-inner">
    <h1>Warden Cannon Calculator</h1>
    <p class="sub-desc">Enter cannon origin and target coordinates. Pick Original or Paper-friendly duper variant based on what you've built.</p>
  </div>
</div>

<div class="wrap">

  <div class="grid2">
    <div class="card">
      <p class="panel-label">Cannon origin</p>
      <div class="coord-row">
        <div class="field">
          <label>X</label>
          <input type="number" id="originX" value="0">
        </div>
        <div class="field">
          <label>Z</label>
          <input type="number" id="originZ" value="0">
        </div>
      </div>
      <div style="margin-top:14px;">
        <label>Facing direction</label>
        <div class="rotation-group" id="rotGroup">
          <div class="rot-btn active" data-rot="SE" onclick="selectRot(this)">SE</div>
          <div class="rot-btn" data-rot="SW" onclick="selectRot(this)">SW</div>
          <div class="rot-btn" data-rot="NE" onclick="selectRot(this)">NE</div>
          <div class="rot-btn" data-rot="NW" onclick="selectRot(this)">NW</div>
        </div>
      </div>
      <div style="margin-top:14px;">
        <label>Duper variant</label>
        <div class="rotation-group" id="varGroup">
          <div class="rot-btn active" data-var="original" onclick="selectVariant(this)">Original</div>
          <div class="rot-btn" data-var="paper" onclick="selectVariant(this)">Paper-friendly</div>
        </div>
      </div>
    </div>
    <div class="card">
      <p class="panel-label">Target coordinate</p>
      <div class="coord-row">
        <div class="field">
          <label>X</label>
          <input type="number" id="targetX" placeholder="e.g. 9988">
        </div>
        <div class="field">
          <label>Z</label>
          <input type="number" id="targetZ" placeholder="e.g. 4995">
        </div>
      </div>
    </div>
  </div>

  <button class="solve" onclick="solve()">Solve</button>

  <div id="results" class="results hidden"></div>

</div>

<script>

const CANNON_CONFIGS = {
  SE: { 
    axisA: 'E', axisB: 'S', 
    offsetX: 0.5, offsetZ: 0.5, 
    aX: 4.103268, aZ: 0.060939, 
    bX: 0.080864, bZ: 4.103891 
  },
  SW: { 
    axisA: 'W', axisB: 'S', 
    offsetX: -0.5, offsetZ: 0.5, 
    aX: -4.103891, aZ: 0.080864, 
    bX: -0.060939, bZ: 4.103268
  },
  NE: { 
    axisA: 'E', axisB: 'N', 
    offsetX: 0.5, offsetZ: -0.5, 
    aX: 4.103268, aZ: -0.080864, 
    bX: 0.060939, bZ: -4.103891
  },
  NW: { 
    axisA: 'W', axisB: 'N', 
    offsetX: -0.5, offsetZ: -0.5, 
    aX: -4.103268, aZ: -0.060939, 
    bX: -0.080864, bZ: -4.103891 
  }
};

const AXIS_NAME = { N:'North', E:'East', S:'South', W:'West' };
let selectedRot = 'SE';

// original: main item = 16 batches. fine-tune (1-15 items) = items+1 batches
// paper: main item = 15 batches. fine-tune = items batches directly.
const VARIANTS = {
  original: { mainBatchesPerItem: 16, dropperMode: 'plusOne', maxDropper: 15, ticksPerBatch: 8,  stageTail: 73 },
  paper:    { mainBatchesPerItem: 15, dropperMode: 'direct',  maxDropper: 16, ticksPerBatch: 16, stageTail: 79 }
};
let selectedVariant = 'original';

function selectRot(el) {
  document.querySelectorAll('#rotGroup .rot-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  selectedRot = el.dataset.rot;
}

function selectVariant(el) {
  document.querySelectorAll('#varGroup .rot-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  selectedVariant = el.dataset.var;
}

function formatStacks(n) {
  const s = Math.floor(n/64), r = n%64;
  if (s === 0) return `${r} items`;
  if (r === 0) return `${s} \u00d7 64`;
  return `${s} \u00d7 64 + ${r} items`;
}

function decomposeBatches(n, v) {
  if (n <= 0) return { mainItems: 0, dropperItems: 0 };
  const P = v.mainBatchesPerItem;
  if (v.dropperMode === 'plusOne') {
    const mainItems = Math.floor((n - 2) / P);
    const remainder = n - P * mainItems;
    return { mainItems, dropperItems: remainder - 1 };
  }
  const mainItems = Math.floor(n / P);
  const remainder = n - P * mainItems;
  return { mainItems, dropperItems: remainder };
}

function isAchievable(n, v) {
  if (n <= 0) return true;
  if (v.dropperMode === 'plusOne') return n !== 1;
  return (n % v.mainBatchesPerItem) <= v.maxDropper;
}

const COUPLING = { P: -0.009512772028424314, Q: 0.000535578795417283 };

// Forward model: raw tick-0 motion for nA, nB units (10 TNT each)
function motionFor(cfg, nA, nB) {
  const m = Math.min(nA, nB);
  const effA = nA + COUPLING.P * m;
  const effB = nB + COUPLING.Q * m;
  return {
    x: cfg.aX * effA + cfg.bX * effB,
    z: cfg.aZ * effA + cfg.bZ * effB
  };
}

function landingFor(cfg, launchX, launchZ, nA, nB) {
  const mo = motionFor(cfg, nA, nB);
  return { x: launchX + mo.x * 0.9, z: launchZ + mo.z * 0.9 };
}

function solve() {
  const oX = parseFloat(document.getElementById('originX').value) || 0;
  const oZ = parseFloat(document.getElementById('originZ').value) || 0;
  const tX = parseFloat(document.getElementById('targetX').value);
  const tZ = parseFloat(document.getElementById('targetZ').value);

  if (isNaN(tX) || isNaN(tZ)) { alert('Enter a target X and Z.'); return; }

  const cfg = CANNON_CONFIGS[selectedRot];

  // Account for sub-block alignment origin offset
  const launchX = oX + cfg.offsetX;
  const launchZ = oZ + cfg.offsetZ;

  // Required raw tick-0 motion (inverting the 0.9 powder snow brake)
  const reqX = (tX - launchX) / 0.9;
  const reqZ = (tZ - launchZ) / 0.9;

  const det = (cfg.aX * cfg.bZ) - (cfg.bX * cfg.aZ);

  // Fixed-point iteration: motion = A*nA + B*nB + (A*P + B*Q)*min(nA,nB).
  // Guess m, move the coupling term to the right side, solve the linear 2x2,
  // update m, repeat until it settles.
  let nA = 0, nB = 0;
  for (let i = 0; i < 100; i++) {
    const m = Math.min(nA, nB);
    const cx = (cfg.aX * COUPLING.P + cfg.bX * COUPLING.Q) * m;
    const cz = (cfg.aZ * COUPLING.P + cfg.bZ * COUPLING.Q) * m;
    const rx = reqX - cx, rz = reqZ - cz;
    const newA = Math.max(0, (rx * cfg.bZ - rz * cfg.bX) / det);
    const newB = Math.max(0, (rz * cfg.aX - rx * cfg.aZ) / det);
    const done = Math.abs(newA - nA) < 1e-9 && Math.abs(newB - nB) < 1e-9;
    nA = newA; nB = newB;
    if (done) break;
  }

  const variant = VARIANTS[selectedVariant];

  // pick the closest landing
  let best = null;
  const baseA = Math.round(nA), baseB = Math.round(nB);
  for (let da = -3; da <= 3; da++) {
    for (let db = -3; db <= 3; db++) {
      const a = Math.max(0, baseA + da), b = Math.max(0, baseB + db);
      if (!isAchievable(a, variant) || !isAchievable(b, variant)) continue;
      const l = landingFor(cfg, launchX, launchZ, a, b);
      const err = Math.hypot(l.x - tX, l.z - tZ);
      if (!best || err < best.err) best = { a, b, l, err };
    }
  }

  renderResults({
    rot: cfg,
    nA: best.a,
    nB: best.b,
    landing: best.l,
    variant
  });
}

// load time
const TRANSPORT_ALIGN_TICKS = 513;

function stageTicks(batchCount, v) {
  return batchCount > 0 ? v.ticksPerBatch * batchCount + v.stageTail : 0;
}

function renderResults(r) {
  const div = document.getElementById('results');
  div.classList.remove('hidden');

  const variant = r.variant;
  const decompA = decomposeBatches(r.nA, variant);
  const decompB = decomposeBatches(r.nB, variant);

  const totalTNT = (r.nA + r.nB) * 10;

  const dropperToBatches = (items) => {
    if (items <= 0) return 0;
    return variant.dropperMode === 'plusOne' ? items + 1 : items;
  };
  const mainBatchesA = decompA.mainItems * variant.mainBatchesPerItem;
  const mainBatchesB = decompB.mainItems * variant.mainBatchesPerItem;
  const dropperBatchesA = dropperToBatches(decompA.dropperItems);
  const dropperBatchesB = dropperToBatches(decompB.dropperItems);
  const mainMax = Math.max(decompA.mainItems, decompB.mainItems);
  const dropperMax = Math.max(decompA.dropperItems, decompB.dropperItems);
  const mainTicks = stageTicks(Math.max(mainBatchesA, mainBatchesB), variant);
  const dropperTicks = stageTicks(Math.max(dropperBatchesA, dropperBatchesB), variant);
  const totalTicks = TRANSPORT_ALIGN_TICKS + mainTicks + dropperTicks;

  const fineCard = (axis, d) => {
    const on = d > 0;
    const batches = dropperToBatches(d);
    const color = on ? 'var(--green)' : 'var(--ink-faint)';
    return `
        <div class="load-card" style="border-left-color: ${on ? 'var(--green)' : 'var(--line)'};">
          <div class="axis">${axis} &dash; dropper</div>
          <div class="time" style="font-size:22px; color:${color};">${d}<span> item${d === 1 ? '' : 's'}</span></div>
          <div class="stacks">${on ? `${batches} batch${batches === 1 ? '' : 'es'} (${batches * 10} TNT)` : 'not needed'}</div>
        </div>`;
  };

  div.innerHTML = `
    <div class="card">
      <p class="panel-label">Required load</p>
      <div class="load-times">
        <div class="load-card">
          <div class="axis">${AXIS_NAME[r.rot.axisA]} &dash; chest</div>
          <div class="time">${decompA.mainItems}<span> items</span></div>
          <div class="stacks">${formatStacks(decompA.mainItems)}</div>
        </div>
        <div class="load-card">
          <div class="axis">${AXIS_NAME[r.rot.axisB]} &dash; chest</div>
          <div class="time">${decompB.mainItems}<span> items</span></div>
          <div class="stacks">${formatStacks(decompB.mainItems)}</div>
        </div>${fineCard(AXIS_NAME[r.rot.axisA], decompA.dropperItems)}${fineCard(AXIS_NAME[r.rot.axisB], decompB.dropperItems)}
      </div>
      <div class="landing-details">
        Predicted landing (expect ±1-3 blocks offset): <b>${r.landing.x.toFixed(0)}, ${r.landing.z.toFixed(0)}</b><br>
        Total TNT loaded: <b>${totalTNT}</b> (${AXIS_NAME[r.rot.axisA]}: ${r.nA*10}, ${AXIS_NAME[r.rot.axisB]}: ${r.nB*10})
      </div>
    </div>
    <div class="card">
      <p class="panel-label">Estimated wait time</p>
      <div class="load-card" style="border-left-color: var(--blue);">
        <div class="time" style="font-size:24px;">${formatTicks(totalTicks)}</div>
        <div class="stacks">
          Main duper: ${formatTicks(mainTicks)} (${mainMax} items, busiest axis) &nbsp;+&nbsp;
          Fine dropper: ${formatTicks(dropperTicks)} (${dropperMax} items, busiest axis) &nbsp;+&nbsp;
          Transport/align: ${formatTicks(TRANSPORT_ALIGN_TICKS)}
        </div>
      </div>
    </div>
  `;
}

function formatTicks(t) {
  const totalSec = t / 20;
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = Math.floor(totalSec % 60);
  const parts = [];
  if (h > 0) parts.push(`${h}h`);
  if (h > 0 || m > 0) parts.push(`${m}m`);
  parts.push(`${s}s`);
  return parts.join(' ');
}
</script>
</body>
</html>
